apply plugin: 'com.android.application'

def p5aTestConfigDirectory = new File(System.getProperty('user.home'), '.config/theory-exam/p5a-test-ca')
def apiCaSourceFile = new File(System.getenv('THEORY_API_CA_FILE')?.trim() ?: new File(System.getProperty('user.home'), '.local/share/theory-exam/pki/p5b-20261022/api-ca.pem').absolutePath)
def apiCaResourceFile = file('src/main/res/raw/theory_exam_api_ca.pem')

tasks.register('prepareApiCaResource') {
    inputs.file(apiCaSourceFile)
    outputs.file(apiCaResourceFile)
    doLast {
        if (!apiCaSourceFile.isFile()) {
            throw new GradleException('The public API CA certificate is missing. Set THEORY_API_CA_FILE to its protected external path; never add the CA private key to the repository.')
        }
        if (apiCaResourceFile.isFile()) {
            if (!java.util.Arrays.equals(apiCaResourceFile.bytes, apiCaSourceFile.bytes)) {
                throw new GradleException('The existing ignored Android API CA resource differs from THEORY_API_CA_FILE; it was left untouched.')
            }
        } else {
            apiCaResourceFile.parentFile.mkdirs()
            java.nio.file.Files.copy(apiCaSourceFile.toPath(), apiCaResourceFile.toPath())
        }
    }
}

// 网络安全配置里必须写死真实部署主机的 IP（Android 的 IP 级 trust-anchor 不支持通配）。
// 这些 IP 属于生产拓扑，不能提交到公开仓库；因此和 CA 证书一样从仓库外注入。
def trustHostsFile = new File(
    System.getenv('THEORY_ANDROID_TRUST_HOSTS_FILE')?.trim()
        ?: new File(System.getProperty('user.home'),
            '.config/theory-exam/p5b-deploy-20261022/android-trust-hosts.txt').absolutePath)
def networkSecurityConfigFile = file('src/main/res/xml/network_security_config.xml')

tasks.register('prepareNetworkSecurityConfig') {
    inputs.file(trustHostsFile)
    inputs.property('checksum', { trustHostsFile.isFile() ? trustHostsFile.text : '' })
    outputs.file(networkSecurityConfigFile)
    doLast {
        if (!trustHostsFile.isFile()) {
            throw new GradleException('The Android trust-host list is missing. Set THEORY_ANDROID_TRUST_HOSTS_FILE to a protected external file with one host per line (no private keys, no credentials).')
        }
        def hosts = trustHostsFile.readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
        if (hosts.isEmpty()) {
            throw new GradleException('The Android trust-host list is empty; refusing to build an APK that trusts no API host.')
        }
        def disallowed = hosts.findAll { !(it ==~ /\d{1,3}(\.\d{1,3}){3}/) }
        if (disallowed) {
            throw new GradleException('Android trust hosts must be plain IPv4 literals; unexpected entries: ' + disallowed.join(', '))
        }
        def domains = hosts.collect { '        <domain includeSubdomains="false">' + it + '</domain>' }.join('\n')
        def config = """<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="false" />
    <domain-config cleartextTrafficPermitted="false">
${domains}
        <trust-anchors>
            <certificates src="@raw/theory_exam_api_ca" />
        </trust-anchors>
    </domain-config>
</network-security-config>
"""
        if (networkSecurityConfigFile.isFile() && networkSecurityConfigFile.text == config) {
            return
        }
        networkSecurityConfigFile.parentFile.mkdirs()
        networkSecurityConfigFile.setText(config, 'UTF-8')
    }
}

android {
    namespace = "com.theoryexam.mobile.dev"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.theoryexam.mobile.dev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.0-dev.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // The ordinary development APK uses Android's system trust store only.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        p5aTest {
            initWith debug
            applicationIdSuffix ".p5atest"
            versionNameSuffix "-p5a-test"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
    }
    sourceSets {
        p5aTest {
            manifest.srcFile new File(p5aTestConfigDirectory, 'AndroidManifest.xml')
            res.srcDir new File(p5aTestConfigDirectory, 'res')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareApiCaResource'), tasks.named('prepareNetworkSecurityConfig'))
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
