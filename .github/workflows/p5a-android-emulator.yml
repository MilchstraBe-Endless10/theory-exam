name: P5-A Android emulator validation

on:
  push:
    branches:
      - feat/p5-a-android-security
    paths:
      - ".github/workflows/p5a-android-emulator.yml"
      - "apps/mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    name: Debug APK installation and native Android smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: "true"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install and assemble debug Android APK
        run: |
          npm ci --prefix apps/mobile
          npm --prefix apps/mobile run android:debug
          test -s apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p emulator-evidence
          sha256sum apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk > emulator-evidence/debug-apk-sha256.txt
      - name: Enable KVM access on GitHub-hosted runner
        run: |
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::This runner has no /dev/kvm; the emulator may be slow."
          fi
      - name: Run real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back emulated -camera-front emulated
          script: |
            set -euo pipefail
            mkdir -p emulator-evidence
            adb wait-for-device
            adb shell getprop ro.build.version.sdk > emulator-evidence/emulator-api-level.txt
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.theoryexam.mobile.dev | tee emulator-evidence/installed-package.txt
            adb shell am start -W -n com.theoryexam.mobile.dev/.MainActivity | tee emulator-evidence/activity-start.txt
            sleep 12
            adb shell pidof com.theoryexam.mobile.dev | tee emulator-evidence/application-pid.txt
            adb exec-out screencap -p > emulator-evidence/01-first-launch.png

            # Instrumentation executes inside an actual Android emulator.
            (cd apps/mobile/android && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace)

            # Exercise Android lifecycle and runtime camera permission transitions.
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n com.theoryexam.mobile.dev/.MainActivity | tee emulator-evidence/activity-resume.txt
            adb shell pm grant com.theoryexam.mobile.dev android.permission.CAMERA
            adb shell dumpsys package com.theoryexam.mobile.dev > emulator-evidence/permissions-after-grant.txt
            adb shell pm revoke com.theoryexam.mobile.dev android.permission.CAMERA
            adb shell dumpsys package com.theoryexam.mobile.dev > emulator-evidence/permissions-after-revoke.txt
            adb exec-out screencap -p > emulator-evidence/02-after-resume.png

            # Verify that a same-debug-signature APK can upgrade in place,
            # preserving the application's private data directory.
            adb shell run-as com.theoryexam.mobile.dev mkdir -p files
            adb shell run-as com.theoryexam.mobile.dev touch files/p5a-upgrade-marker
            sed -i 's/versionCode 1/versionCode 2/' apps/mobile/android/app/build.gradle
            sed -i 's/versionName "1.0.0-dev.1"/versionName "1.0.0-dev.2"/' apps/mobile/android/app/build.gradle
            (cd apps/mobile/android && ./gradlew assembleDebug --no-daemon)
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.theoryexam.mobile.dev ls files/p5a-upgrade-marker | tee emulator-evidence/upgrade-data-preserved.txt
            adb shell dumpsys package com.theoryexam.mobile.dev | grep -m 1 -E 'versionCode=2' | tee emulator-evidence/upgraded-version.txt
            adb shell am start -W -n com.theoryexam.mobile.dev/.MainActivity | tee emulator-evidence/after-upgrade-launch.txt
            sleep 5
            adb exec-out screencap -p > emulator-evidence/03-after-upgrade.png

            # Evidence of fatal crashes only; no database, credentials or production traffic.
            adb logcat -d -t 600 -s AndroidRuntime:E > emulator-evidence/android-fatal-errors.txt || true
            if grep -E 'FATAL EXCEPTION|Process: com.theoryexam.mobile.dev' emulator-evidence/android-fatal-errors.txt; then
              echo "::error::Fatal Android runtime exception detected"
              exit 1
            fi
            echo "EMULATOR INSTALL, INSTRUMENTATION, LIFECYCLE, CAMERA PERMISSION, DEBUG APK UPGRADE: PASSED" | tee emulator-evidence/smoke-summary.txt
      - name: Upload test-only emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5a-android-emulator-evidence
          path: |
            emulator-evidence/
            apps/mobile/android/app/build/outputs/androidTest-results/
            apps/mobile/android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
